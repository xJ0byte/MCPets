# ---------------------------------------------------------------------------
#  MCPets - zentrale Build-Konfiguration
#  Alle Versionen leben hier. Im Build-Script steht keine einzige fest.
# ---------------------------------------------------------------------------

group=de.j0byte
version=5.0.0

# Java / Toolchain
javaVersion=25

# Plattformen
paperApiVersion=1.21.11-R0.1-SNAPSHOT
paperApiTarget=1.21
velocityApiVersion=4.1.0

# Bibliotheken
lombokVersion=1.18.48
annotationsVersion=26.0.2
guavaVersion=33.4.8-jre
guiceVersion=7.0.0
commandApiVersion=12.0.0
betterModelVersion=3.4.1

# Lokale Framework-Jars (libs/) - siehe README
sharkApiJar=libs/shark-api-1.0.0.jar
sharkGuiJar=libs/shark-gui-1.0.0.jar
octopusApiJar=libs/octopus-api-1.1.0.jar
chameleonApiJar=libs/chameleon-api-1.0.0.jar

# Gradle-Plugins
shadowVersion=9.2.0
foojayVersion=1.0.0

# Shading
relocationBase=de.j0byte.mcpets.libs

# Gradle
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
